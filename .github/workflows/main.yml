name: Generate Lion Contribution Graph SVG

on:
  schedule:
    # Run every 12 hours automatically
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# Explicitly grant write permissions to GITHUB_TOKEN for committing & pushing
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate Lion Contribution Graph SVG
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: dark
          OUTPUT_FILENAME: github-contribution-grid-lion.svg
        run: |
          python generate_svg.py

      - name: Commit and Push SVG to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-lion.svg
          git commit -m "chore: update lion contribution graph SVG [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Deploy to output branch
        run: |
          git checkout --orphan output || git checkout output
          git rm -rf .
          git checkout main -- github-contribution-grid-lion.svg README.md
          git add github-contribution-grid-lion.svg README.md
          git commit -m "deploy: update lion contribution graph SVG" || echo "No changes to commit"
          git push origin output --force
