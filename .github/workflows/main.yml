name: CI/CD Build, Deploy, and Contribution Booster

on:
  push:
    branches:
      - main
  schedule:
    # Triggers automatically every day at 12:00 PM UTC to guarantee a daily contribution/commit
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to trigger this manually from the GitHub Actions tab

permissions:
  contents: write # Crucial: Gives the workflow permission to push commits back to your repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetches all history so git push works cleanly
          fetch-depth: 0 

      # Step 2: Set up the environment (Example using Node.js, change to Python/Java/etc. if needed)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies and Build the application
      - name: Install & Build Project
        run: |
          npm install
          npm run build --if-present

      # Step 4: Deploy the project (Template step - swap this out for your actual deployment target)
      - name: Deploy Application
        run: |
          echo "Deploying project to production server..."
          # Replace this block with your cloud deployment command (e.g., AWS, Vercel, Netlify, Docker, or Gh-Pages)

      # Step 5: Generate an automated activity log update to trigger a Git commit
      - name: Update Contribution Activity Log
        run: |
          mkdir -p .github/logs
          echo "Automated build and deploy completed successfully on $(date)" >> .github/logs/activity.txt

      # Step 6: Commit and Push changes back to GitHub to increase your contribution graph
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated deployment and activity sync [skip ci]"
          branch: main
          file_pattern: '.github/logs/activity.txt'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
