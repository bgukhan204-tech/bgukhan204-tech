<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lion GitHub Contribution Graph Preview</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #f0f6fc;
      --text-muted: #8b949e;
      --accent-color: #e5a93c;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 900px;
      padding: 40px 20px 20px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0 0 10px;
      background: linear-gradient(135deg, #f7cf88, #e5a93c, #9e5818);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin: 0 0 30px;
    }

    .preview-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      max-width: 880px;
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .svg-wrapper {
      width: 100%;
      overflow-x: auto;
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }

    .svg-wrapper img {
      max-width: 100%;
      height: auto;
    }

    .controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }

    .btn {
      background: #21262d;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: #30363d;
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .btn-primary {
      background: linear-gradient(135deg, #e5a93c, #9e5818);
      color: #111;
      border: none;
    }

    .badge {
      display: inline-block;
      background: rgba(229, 169, 60, 0.15);
      color: var(--accent-color);
      border: 1px solid rgba(229, 169, 60, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>🦁 GitHub Lion Contribution Graph</h1>
    <p class="subtitle">Custom SVG Graph Generator with Vector Lion Run-Cycle Animation</p>
    <div class="badge">Live SVG Preview</div>
  </header>

  <div class="preview-container">
    <div class="svg-wrapper" id="svgHolder">
      <img id="lionSvg" src="github-contribution-grid-lion.svg?v=1" alt="Lion Contribution Graph">
    </div>

    <div class="controls">
      <button class="btn" onclick="refreshSvg()">🔄 Reload SVG</button>
      <button class="btn" onclick="toggleTheme()">☯️ Toggle Dark/Light Background</button>
      <a class="btn btn-primary" href="github-contribution-grid-lion.svg" download="github-contribution-grid-lion.svg">⬇️ Download SVG</a>
    </div>
  </div>

  <footer>
    <p>Generated via <code>python generate_svg.py</code> for <code>@bgukhan204-tech</code></p>
  </footer>

  <script>
    function refreshSvg() {
      const img = document.getElementById('lionSvg');
      img.src = 'github-contribution-grid-lion.svg?t=' + new Date().getTime();
    }

    let isDarkBg = true;
    function toggleTheme() {
      const container = document.querySelector('.preview-container');
      isDarkBg = !isDarkBg;
      if (isDarkBg) {
        container.style.backgroundColor = '#161b22';
      } else {
        container.style.backgroundColor = '#ffffff';
      }
    }
  </script>
</body>
</html>
